<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get a Quote - RR2GLOBAL</title>
  <meta name="description" content="Request a custom quote from RR2Global for your next event, exhibition booth, brand activation, or luxury interior fit-out project.">
  <meta property="og:title" content="Get a Quote - RR2GLOBAL">
  <meta property="og:description" content="Request a custom quote from RR2Global for your next event, exhibition booth, brand activation, or luxury interior fit-out project.">
  <meta property="og:image" content="assets/logo.webp">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1780922111623">
  <link rel="icon" type="image/png" href="assets/logo.webp">
  <!-- IntlTelInput CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
  <style>
    /* IntlTelInput Custom Dark Theme */
    .iti { width: 100%; }
    .iti__country-list {
        background-color: #151515 !important;
        color: #fff !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        border-radius: 0.5rem;
    }
    .iti__country.iti__highlight {
        background-color: #00D1B2 !important;
        color: #000 !important;
    }
    .iti__dial-code { color: inherit; }
  </style>
  <!-- Critical style to prevent white flash on load -->
  <style>
    html,
    body {
      background-color: #000000 !important;
    }
  </style>
</head>

<body>
  <div data-include="navbar.html"></div>

  <!-- Page Header -->
  <header class="page-header">
    <div class="header-overlay"></div>
    <div class="container text-center text-white">
      <h1 class="display-1 fw-bold" data-aos="fade-up">GET <span class="text-gradient-hero">QUOTE</span></h1>
      <p class="lead mt-3" data-aos="fade-up" data-aos-delay="200">Request a customized proposal for your next
        extraordinary project.</p>
    </div>
  </header>

  <main>
    <section class="get-quote-section py-5">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="quote-form-card p-5 rounded-5 shadow-lg border"
              style="background: #0A0A0A; border-color: rgba(255,255,255,0.1) !important;" data-aos="fade-up">
              <div class="row g-5">

                <div class="col-12">
                  <form id="detailedQuoteForm" action="https://formsubmit.co/aravindn210@gmail.com" method="POST"
                    enctype="multipart/form-data">
                    <input type="hidden" name="_subject" value="New Quote Request">
                    <input type="hidden" name="_template" value="table">
                    <input type="text" name="_honey" style="display:none">
                    <div class="row g-4">
                      <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">First Name</label>
                        <input name="first_name" type="text"
                          class="form-control form-control-lg bg-dark text-white border-0 px-4 py-3 rounded-4"
                          placeholder="First Name" required style="background: #151515 !important;">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Last Name</label>
                        <input name="last_name" type="text"
                          class="form-control form-control-lg bg-dark text-white border-0 px-4 py-3 rounded-4"
                          placeholder="Last Name" required style="background: #151515 !important;">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Work Email</label>
                        <input name="email" type="email"
                          class="form-control form-control-lg bg-dark text-white border-0 px-4 py-3 rounded-4"
                          placeholder="Email Address" required style="background: #151515 !important;">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Phone
                          Number</label>
                        <input name="phone" type="tel" id="phone"
                          class="form-control form-control-lg bg-dark text-white border-0 pe-4 py-3 rounded-4"
                          placeholder="Your Number" style="background: #151515 !important;">
                      </div>

                      <div class="col-12">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Project
                          Category</label>
                        <div class="d-flex flex-wrap gap-2 pt-2">
                          <input type="radio" class="btn-check" name="category" id="cat-events" value="Events">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-events">Events</label>

                          <input type="radio" class="btn-check" name="category" id="cat-weddings" value="Weddings">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-weddings">Weddings</label>

                          <input type="radio" class="btn-check" name="category" id="cat-exhibitions" value="Exhibitions" checked>
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-exhibitions">Exhibitions</label>

                          <input type="radio" class="btn-check" name="category" id="cat-activations" value="Activations">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-activations">Activations</label>

                          <input type="radio" class="btn-check" name="category" id="cat-design" value="Design">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-design">Design</label>

                          <input type="radio" class="btn-check" name="category" id="cat-branding" value="Branding">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-branding">Branding</label>

                          <input type="radio" class="btn-check" name="category" id="cat-interior-fit-out" value="Interior Fit Out">
                          <label class="btn btn-outline-aqua rounded-pill px-4" for="cat-interior-fit-out">Interior Fit Out</label>
                        </div>
                      </div>

                      <div class="col-12 mt-4">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Project Description
                          &
                          Requirements</label>
                        <textarea name="details"
                          class="form-control form-control-lg bg-dark text-white border-0 px-4 py-3 rounded-4" rows="5"
                          placeholder="Tell us about the project scale, location, and your specific goals..." required
                          style="background: #151515 !important;"></textarea>
                      </div>

                      <div class="col-12 mt-4">
                        <label class="form-label small fw-bold text-uppercase text-white opacity-50">Upload Brief/RFP
                          (Optional)</label>
                        <div class="input-group">
                          <input name="attachment" type="file"
                            class="form-control form-control-lg bg-dark text-white border-0 px-4 py-3 rounded-4"
                            style="background: #151515 !important;">
                        </div>
                        <div class="form-text mt-2 small text-white opacity-50">Supported formats: PDF, DOCX, ZIP, JPG
                          (Max 10MB)
                        </div>
                      </div>

                      <div class="col-12 mt-5 text-center">
                        <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill shadow-lg">SUBMIT
                          QUOTE REQUEST</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
  <script src="js/include-partials.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });

    // Navbar scroll effect
    window.addEventListener('scroll', function () {
      const nav = document.querySelector('.navbar');
      if (nav) {
        if (window.scrollY > 50) {
          nav.classList.add('navbar-scrolled');
        } else {
          nav.classList.remove('navbar-scrolled');
        }
      }
    });

    // Initialize IntlTelInput
    const phoneInputField = document.querySelector("#phone");
    const phoneInput = window.intlTelInput(phoneInputField, {
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
        initialCountry: "ae", // Default to UAE
        separateDialCode: true,
    });
  </script>
</body>

</html>
