<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RR2Global | Latest News</title>
    <meta name="description"
        content="RR2Global News - Stay updated with the latest in event innovation, exhibitions, and interior design trends.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1780922111647">
    <link rel="icon" type="image/png" href="assets/logo.webp">
</head>

<body>

    <div data-include="navbar.html"></div>

    <!-- News Header -->
    <header class="page-header">
        <div class="header-overlay"></div>
        <div class="container text-center text-white">
            <h1 class="display-1 fw-bold">LATEST <span class="text-gradient-hero">NEWS</span></h1>
            <p class="lead mt-3">Stay Updated with Innovation & Design Trends</p>
        </div>
    </header>

    <!-- News Section -->
    <section class="highlights-section py-5">
        <div class="container">
            <div class="section-header text-center mb-5" data-aos="fade-up">
                <h2 class="display-4 fw-bold">Our News & Updates</h2>
                <div class="title-underline"></div>
            </div>
            <div class="row g-4 justify-content-center">
                <div class="col-md-6 col-lg-5" data-aos="zoom-in" data-aos-delay="100">
                    <a href="news-1.html" class="text-decoration-none">
                        <div class="highlight-card">
                            <div class="card-img-wrapper">
                                <img src="assets/evolution_in_motion.webp" alt="Evolution in Motion">
                            </div>
                            <div class="card-body-custom text-white">
                                <span class="date">FEB 2026</span>
                                <h4>A New Chapter: Evolution in Motion</h4>
                                <p>RR2Global is moving to a new home to optimize workflow and creativity.</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Ultra-Minimal Subscribe Section -->
    <section class="py-5">
        <div class="container">
            <div class="newsletter-minimal mx-auto mt-5 text-center" data-aos="fade-up">
                <div class="mb-3">
                    <p class="text-white mb-0 fw-bold text-uppercase h5">
                        Ordinary updates? Not here
                    </p>
                    <p class="text-white mb-0 h5">
                        Subscribe to our newsletter
                    </p>
                </div>
                <form class="d-flex align-items-center justify-content-center">
                    <div class="input-group-minimal">
                        <input type="email" class="minimal-input" placeholder="Enter your email address">
                        <button type="submit" class="minimal-submit">
                            <i class="fa-solid fa-angle-right"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>



    <div data-include="footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script src="js/include-partials.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 100
        });

        // Navbar scroll effect
        window.addEventListener('scroll', function () {
            const nav = document.querySelector('.navbar');
            if (nav) {
                if (window.scrollY > 50) {
                    nav.classList.add('navbar-scrolled');
                } else {
                    nav.classList.remove('navbar-scrolled');
                }
            }
        });
    </script>
</body>

</html>
